# Cấu hình API Endpoints
endpoints:
  thegraph_subgraph_id: "5zvR82QoaXYFyDEKLZ9t6v9adgnptxYpKpSbxtgVENFV"
  thegraph_gateway_url: "https://gateway.thegraph.com/api/{api_key}/subgraphs/id/{subgraph_id}"
  binance_klines_url: "https://api.binance.com/api/v3/klines"
  defillama_protocol_url: "https://api.llama.fi/protocol/uniswap-v3"
  etherscan_api_url: "https://api.etherscan.io/api"

# Tham số tính toán Features
features:
  volatility_windows: [24, 168, 720] # 1 ngày, 7 ngày, 30 ngày (theo giờ)
  annualization_factor_hourly: 8760 # 24 * 365
  garch:
    p: 1
    q: 1
    mean: "Zero"
    dist: "Normal"
    refit_frequency_hours: 24 # Daily refit để tối ưu tốc độ và không look-ahead
  gas:
    estimated_rebalance_gas_units: 300000

# Ngưỡng Unit Test kiểm tra tính toàn vẹn dữ liệu
testing:
  max_missing_ratio: 0.05
  max_consecutive_missing_hours: 6
  outlier_price_deviation_ratio: 0.15 # Cảnh báo nếu giá lệch > 15% so với benchmark