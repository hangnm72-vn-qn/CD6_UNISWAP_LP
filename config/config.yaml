# Cấu hình chung cho Pipeline Thu thập & Xử lý Dữ liệu Uniswap v3
project:
  name: "uniswap-v3-lp-optimizer"
  version: "1.0.0"

# Cấu hình thời gian lấy dữ liệu (UTC, bao gồm toàn bộ ngày kết thúc)
timeframe:
  start_date: "2023-01-01T00:00:00Z"
  end_date: "2026-10-15T23:00:00Z"
  granularity: "hourly" # 'hourly' hoặc 'daily'

# Danh sách 5 Pool trọng tâm trên Ethereum Mainnet
pools:
  - name: "WETH-USDC-005"
    address: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"
    fee_tier: 500
    token0:
      symbol: "USDC"
      decimals: 6
    token1:
      symbol: "WETH"
      decimals: 18
    price_quote: "USD_per_WETH"

  - name: "WETH-USDC-030"
    address: "0x8ad599c3a0ff1de082011efddc58f1908eb6e6d8"
    fee_tier: 3000
    token0:
      symbol: "USDC"
      decimals: 6
    token1:
      symbol: "WETH"
      decimals: 18
    price_quote: "USD_per_WETH"

  - name: "WETH-USDT-030"
    address: "0x4e68ccd3e89f51c3074ca5072bbac773960dfa36"
    fee_tier: 3000
    token0:
